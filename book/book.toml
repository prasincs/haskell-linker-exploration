[book]
title = "Haskell Linker Exploration"
authors = ["Prasanna"]
language = "en"
multilingual = false
src = "src"
description = "A deep technical exploration into how Haskell programs are really built, why modern linkers like lld can't link Haskell code on their own, and what makes GHC an indispensable orchestrator for your Haskell applications."

[build]
build-dir = "book"
create-missing = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/prasincs/haskell-linker-exploration"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/prasincs/haskell-linker-exploration/edit/main/book/{path}"
site-url = "/haskell-linker-exploration/"
cname = ""
additional-css = []
additional-js = []
no-section-label = false
playground = { editable = true, copyable = true, line-numbers = true }

[output.html.print]
enable = true

[output.html.fold]
enable = false
level = 0

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
